server {
    listen 80;
    listen [::]:80;
    server_name crescentsphere.com www.crescentsphere.com;

    root /var/www/crescentsphere/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # The HTML entry point must revalidate so deployments become visible quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Known client-side routes receive the SPA entry point on direct navigation.
    location ~ ^/(?:mail|mailer|docs|connect|notes|keylang|products|about|privacy|terms)/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Reserved application boundary. The React feature gate keeps it unavailable
    # until VITE_CONSOLE_ENABLED is intentionally enabled in a future build.
    location ~ ^/console(?:/.*)?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    # Vite bundles and public product assets can be cached between deployments.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /products/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* ^/(?:icons|og)/.*\.(?:png|webp|avif|jpg|jpeg|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt { try_files $uri =404; expires 1h; }
    location = /sitemap.xml { try_files $uri =404; expires 1h; }
    location = /site.webmanifest { try_files $uri =404; expires 1d; }

    # Unknown direct URLs return an actual HTTP 404 rather than a false 200 SPA shell.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
